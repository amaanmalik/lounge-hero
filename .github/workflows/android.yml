name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
      - name: Build Android debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signature and publish
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          mkdir -p dist
          cp "$apk" dist/HeroLounge-debug.apk
          (cd dist && sha256sum HeroLounge-debug.apk > HeroLounge-debug.apk.sha256)
      - uses: actions/upload-artifact@v6
        with:
          name: HeroLounge-Android-debug
          path: dist/
          if-no-files-found: error
          retention-days: 30
